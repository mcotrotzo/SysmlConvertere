on:
  pull_request:
    branches:
      - "master"
jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          server-id: github
          settings-path: ${{ github.workspace }}
      - name: Download and install SysML dependency
        run: mvn -Psetup initialize
      - name: Test
        run: mvn clean test